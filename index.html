  <script>
/**
 * Store: einfacher Key-Value-Speicher mit zwei Backends.
 *  - LocalStorage (immer aktiv, dient auch als Cache/Fallback)
 *  - Supabase (optional, Echtzeit-Sync für alle)
 *
 * Jeder Eintrag hat einen eigenen Key (z. B. "vote/ss/0/aaron-stein"). Dadurch überschreiben
 * sich gleichzeitige Änderungen verschiedener Personen nicht gegenseitig.
 * API: Store.get / set / del / list(prefix) / onChange / exportJSON / importJSON / status
 */
(function () {
  const LS = "abi24:data";
  let data = {}, pending = 0, pollT = null, stamps = {};
  let mode = "local"; // local | live | connecting | error
  let client = null;
  const subs = new Set();

  try { data = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { data = {}; }

  const emit = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  const emitStatus = () => window.dispatchEvent(new CustomEvent("abi:status"));
  const err = msg => window.dispatchEvent(new CustomEvent("abi:error", { detail: msg }));

  function persist() {
    if (client) return; // mit Supabase ist die Datenbank die Quelle, kein Browser-Cache nötig
    try { localStorage.setItem(LS, JSON.stringify(data)); }
    catch (e) { if (mode !== "live") err("Browser-Speicher voll – bitte weniger/kleinere Fotos oder Supabase nutzen."); }
  }

  // Änderungen aus anderen Tabs desselben Browsers übernehmen
  window.addEventListener("storage", e => {
    if (e.key === LS) { try { data = JSON.parse(e.newValue) || {}; } catch (_) {} emit(); }
  });

  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("Script nicht ladbar: " + src));
      document.head.appendChild(s);
    });
  }

  async function initRemote() {
    const c = window.ABI_CONFIG || {};
    if (!c.supabaseUrl || !c.supabaseAnonKey) return;
    mode = "connecting"; emitStatus();
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
      client = window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey);
      const { data: rows, error } = await client.from("abi_docs").select("key,value,updated_at");
      if (error) throw error;
      rows.forEach(r => { data[r.key] = r.value; stamps[r.key] = r.updated_at; });
      persist(); emit();
      // Sicherheitsnetz: alle 5 s neu abfragen, falls Realtime in Supabase nicht eingeschaltet ist
      mode = "live"; emitStatus();
      pollT = setInterval(poll, 8000);
      client.channel("abi_docs_changes")
        .on("postgres_changes", { event: "*", schema: "public", table: "abi_docs" }, p => {
          if (p.eventType === "DELETE") { delete data[p.old.key]; delete stamps[p.old.key]; }
          else { data[p.new.key] = p.new.value; stamps[p.new.key] = p.new.updated_at; }
          persist(); emit();
        })
        .subscribe(st => { mode = st === "SUBSCRIBED" ? "live" : "connecting"; emitStatus(); });
    } catch (e) {
      console.error(e); mode = "error"; client = null; emitStatus();
      err("Supabase nicht erreichbar – arbeite lokal weiter. (" + (e.message || e) + ")");
    }
  }

  // Leichtes Nachladen: nur Schlüssel + Zeitstempel abfragen (wenige KB), Inhalte/Bilder nur für wirklich geänderte Einträge
  async function poll() {
    if (!client || pending > 0 || document.hidden) return;
    try {
      const { data: list, error } = await client.from("abi_docs").select("key,updated_at");
      if (error || pending > 0) return;
      const remote = {}; list.forEach(r => { remote[r.key] = r.updated_at; });
      let changed = false;
      for (const k of Object.keys(stamps)) if (!(k in remote)) { delete stamps[k]; delete data[k]; changed = true; }
      const need = Object.keys(remote).filter(k => !(k in stamps) || Date.parse(stamps[k]) !== Date.parse(remote[k]));
      for (let i = 0; i < need.length; i += 25) {
        const { data: rows, error: e2 } = await client.from("abi_docs").select("key,value,updated_at").in("key", need.slice(i, i + 25));
        if (e2 || pending > 0) return;
        rows.forEach(r => { data[r.key] = r.value; stamps[r.key] = r.updated_at; changed = true; });
      }
      if (changed) emit();
    } catch (e) { /* nächster Versuch in 8 s */ }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  window.Store = {
    get: k => data[k],
    list(prefix) {
      return Object.keys(data).filter(k => k.startsWith(prefix)).sort()
        .map(k => ({ key: k, value: data[k] }));
    },
    async set(k, v) {
      data[k] = v; persist(); emit();
      if (client) {
        pending++;
        try {
          const ts = new Date().toISOString();
          const { error } = await client.from("abi_docs").upsert({ key: k, value: v, updated_at: ts });
          if (error) err("Speichern fehlgeschlagen: " + error.message); else stamps[k] = ts;
        } finally { pending--; }
      }
    },
    async del(k) {
      delete data[k]; persist(); emit();
      if (client) {
        pending++;
        try {
          const { error } = await client.from("abi_docs").delete().eq("key", k);
          if (error) err("Löschen fehlgeschlagen: " + error.message); else delete stamps[k];
        } finally { pending--; }
      }
    },
    onChange(f) { subs.add(f); },
    status: () => mode,
    exportJSON: () => JSON.stringify({ app: "abi-zeitung", version: 1, exported: new Date().toISOString(), data }, null, 2),
    async importJSON(text) {
      const obj = JSON.parse(text);
      const d = obj.data || obj;
      for (const k of Object.keys(d)) await this.set(k, d[k]);
    },
    resetLocal() { data = {}; localStorage.removeItem(LS); emit(); },
    init: initRemote
  };
})();

</script>
  <script>
/**
 * Abi-Zeitung BGYT24 – Hauptlogik
 * Aufbau:  1) Helfer  2) Identität  3) Datenzugriff  4) Wiederverwendbare Bausteine (Pinnwand, Tabs)
 *          5) Kapitel (Views)  6) Router & Rendering  7) Events (Formulare/Klicks)  8) Druck/PDF  9) Start
 */
(function () {
  "use strict";

  /* ============ 1) Helfer ============ */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fmt = (n, d = 1) => Number(n).toLocaleString("de-DE", { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const dateStr = ts => new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });
  const state = { dirty: false, printing: false, pending: false };

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3500);
  }
  window.addEventListener("abi:error", e => toast(e.detail));

  /** Bild wählen -> verkleinern -> JPEG-DataURL (spart Speicherplatz) */
  function resizeImage(file, max = 900, q = 0.72) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = () => rej(new Error("Bild konnte nicht gelesen werden"));
      img.src = url;
    });
  }

  /* ============ 2) Identität (wer bin ich?) ============ */
  // Hinweis: "Soft"-Identität ohne Passwort – reicht für eine Klassen-Zeitung, ist aber kein Sicherheitsfeature.
  let me = null;
  try { me = JSON.parse(localStorage.getItem("abi24:me")); } catch (e) { me = null; }
  const saveMe = m => { me = m; localStorage.setItem("abi24:me", JSON.stringify(m)); };
  const meName = () => (me ? me.name : "Anonym");
  const needMe = () => { if (!me) { toast("Bitte wähle oben zuerst deinen Namen („Ich bin“)."); return false; } return true; };

  /* ============ 3) Datenzugriff ============ */
  function students() {
    const map = new Map(ABI.students.map(s => [s.id, { ...s }]));
    Store.list("student/").forEach(({ key, value }) => {
      const id = key.slice(8);
      map.set(id, { unsure: false, ...(map.get(id) || {}), ...value, id });
    });
    return [...map.values()].filter(s => !s.deleted);
  }
  function teachers() {
    const map = new Map(ABI.teachers.map(s => [s.id, { ...s }]));
    Store.list("teacher/").forEach(({ key, value }) => {
      const id = key.slice(8);
      map.set(id, { unsure: false, ...(map.get(id) || {}), ...value, id });
    });
    return [...map.values()].filter(s => !s.deleted);
  }
  const studentById = id => students().find(s => s.id === id);

  /* ============ 4) Wiederverwendbare Bausteine ============ */
  function tabs(base, items, active) {
    return `<nav class="tabs no-print">${items.map(i =>
      `<a href="#/${base}/${esc(i.id)}" class="${i.id === active ? "active" : ""}">${esc(i.label)}</a>`).join("")}</nav>`;
  }

  /** Pinnwand: beliebig viele Einträge (Text + optionales Foto) unter einem Schlüssel */
  function pinboard(key, o = {}) {
    const items = Store.list(`entry/${key}/`).map(e => ({ k: e.key, ...e.value })).sort((a, b) => b.ts - a.ts);
    const card = e => `<div class="card">
      ${e.img ? `<img src="${e.img}" alt="">` : ""}
      <div class="in">${e.title ? `<h4>${esc(e.title)}</h4>` : ""}${e.t ? `<p>${esc(e.t)}</p>` : ""}
        <div class="by"><span>${esc(e.by)} · ${dateStr(e.ts)}</span>
        <button class="btn ghost tiny no-print" data-act="delpin" data-k="${esc(e.k)}" title="Eintrag löschen">✕</button></div></div></div>`;
    return `<div class="pin ${o.gallery ? "gallery" : ""}">
      ${o.hints ? `<div class="hints">${o.hints.map(h => `<span class="chip">${esc(h)}</span>`).join("")}</div>` : ""}
      ${state.printing ? "" : `<form class="pin-form no-print" data-form="pin" data-key="${esc(key)}" data-photo-only="${o.gallery ? 1 : 0}">
        ${o.title ? `<input name="title" placeholder="${esc(o.titlePh || "Titel / Name (optional)")}">` : ""}
        ${o.gallery ? "" : `<textarea name="t" rows="2" placeholder="${esc(o.placeholder || "Spruch, Erinnerung, Eintrag …")}"></textarea>`}
        <div class="row"><label class="btn ghost">📷 Foto${o.gallery ? " hochladen" : ""}<input type="file" name="photo" accept="image/*" hidden ${o.gallery ? "multiple" : ""}></label>
        <span class="fname muted small"></span><button class="btn">Eintragen</button></div></form>`}
      <div class="cards">${items.map(card).join("") || '<p class="muted">Noch keine Einträge – sei der/die Erste!</p>'}</div></div>`;
  }

  /** Foto-Feld mit Upload (ein einzelnes Bild unter einem Schlüssel) */
  function photoBox(src, label, attrs, editable, cls = "") {
    return `<${editable ? "label" : "div"} class="photo ${cls}">${src ? `<img src="${src}" alt="${esc(label)}">` : `<span>${esc(label)}${editable ? "<br>📷 zum Hochladen klicken" : ""}</span>`}
      ${editable ? `<input type="file" accept="image/*" ${attrs}>` : ""}</${editable ? "label" : "div"}>`;
  }

  /* ============ 5) Kapitel ============ */
  const VIEWS = {}, ORDER = [];
  function view(id, title, icon, def) { VIEWS[id] = { id, title, icon, ...def }; ORDER.push(id); }
  const heading = v => `<h2>${v.icon} ${esc(v.title)}</h2>`;

  /* --- 1. Titelseite --- */
  view("cover", "Titelseite", "🚪", {
    render() {
      const rays = Array.from({ length: 16 }, (_, i) => {
        const a = (i / 16) * Math.PI * 2, x = 200 + Math.cos(a) * 300, y = 285 + Math.sin(a) * 300;
        return `<line x1="200" y1="285" x2="${x.toFixed(0)}" y2="${y.toFixed(0)}" stroke="#ffd978" stroke-opacity=".25" stroke-width="6"/>`;
      }).join("");
      return `<div class="chapter cover">
        <svg class="door" viewBox="0 0 400 520" role="img" aria-label="Offene Tür mit Licht">
          <defs><radialGradient id="glow" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffc94d"/><stop offset="1" stop-color="#f4a62a" stop-opacity="0"/></radialGradient></defs>
          <rect width="400" height="520" fill="#1b1f3a"/><circle cx="200" cy="285" r="250" fill="url(#glow)"/>${rays}
          <rect x="120" y="120" width="160" height="330" fill="#fff6c8"/>
          <rect x="120" y="120" width="160" height="330" fill="none" stroke="#0e1128" stroke-width="14"/>
          <polygon points="120,120 66,146 66,478 120,450" fill="#7a4b2a" stroke="#0e1128" stroke-width="4"/>
          <circle cx="82" cy="300" r="6" fill="#ffd978"/>
          <rect y="450" width="400" height="70" fill="#0e1128"/>
          <polygon points="150,450 250,450 330,520 70,520" fill="#ffd978" fill-opacity=".35"/>
          <text x="200" y="85" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#fff" font-weight="700">ABITUR</text>
          <text x="200" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#ffd978" letter-spacing="4">DURCH DIE TÜR</text></svg>
        <h1>${esc(ABI.title)}</h1><div class="sub">${esc(ABI.subtitle)}</div><div class="badge">${esc(ABI.jahrgang)}</div>
        <div class="chapters no-print">${ORDER.slice(1).map(id => `<a href="#/${id}">${VIEWS[id].icon} ${esc(VIEWS[id].title)}</a>`).join("")}</div></div>`;
    }
  });

  /* --- 2. Vorwort --- */
  view("vorwort", "Vorwort", "✍️", {
    render() {
      return `<div class="chapter vorwort">${heading(this)}
        ${ABI.vorwort.map(p => `<p>${esc(p)}</p>`).join("")}
        <p><strong>In diesem Sinne:</strong></p><blockquote>${esc(ABI.vorwortSpruch)}</blockquote>
        <h3>Weitere Grußworte &amp; Ergänzungen</h3>${pinboard("vorwort", { title: true, titlePh: "Von wem?", placeholder: "Dein Grußwort …" })}</div>`;
    }
  });

  /* --- 3. Klassenliste --- */
  view("klasse", "Klassenliste", "👥", {
    render() {
      const photo = Store.get("photo/class");
      const list = students();
      return `<div class="chapter">${heading(this)}
        ${photoBox(photo, "Klassen-/Stufenfoto (Platzhalter)", 'data-change="classphoto"', !state.printing, "wide")}
        <p class="muted small no-print">Namen anklicken → Steckbrief. „?“ = im PDF unsicher – mit ✔ bestätigen, mit ✎ korrigieren.</p>
        <div class="chips">${list.map(s => {
          const unsure = s.unsure && !s.confirmed;
          return `<span class="chip ${unsure ? "unsure" : ""}"><a href="#/steckbriefe/${esc(s.id)}">${esc(s.name)}${unsure ? " ?" : ""}</a>
            <span class="no-print">${unsure ? `<button data-act="confirmStudent" data-id="${esc(s.id)}" title="Bestätigen">✔</button>` : ""}
            <button data-act="renameStudent" data-id="${esc(s.id)}" title="Name ändern">✎</button>
            <button data-act="delStudent" data-id="${esc(s.id)}" title="Entfernen">✕</button></span></span>`;
        }).join("")}</div>
        <p><strong>${list.length}</strong> Personen</p>
        <form class="row no-print" data-form="addStudent"><input name="name" placeholder="Name ergänzen …" required style="max-width:280px"><button class="btn">+ Hinzufügen</button></form></div>`;
    }
  });

  /* --- 4. Das sind wir + Statistik --- */
  function numVals(rows, k) { return rows.map(r => parseFloat(r[k])).filter(Number.isFinite); }
  function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
  function bars(counts, total, lead = true) {
    const max = Math.max(...counts.map(c => c[1]), 0);
    return counts.map(([l, n]) => `<div class="bar ${lead && n === max && n > 0 ? "lead" : ""}"><span>${esc(l)}</span>
      <span class="track"><span class="fill" style="display:block;width:${total ? (n / total) * 100 : 0}%"></span></span>
      <span>${total ? Math.round((n / total) * 100) : 0} %</span></div>`).join("");
  }
  view("wir", "Das sind wir", "📸", {
    render() {
      const rows = Store.list("survey/").map(r => r.value), n = rows.length;
      const mine = me ? Store.get("survey/" + me.id) || {} : {};
      const F = ABI.survey.map(f => ({ ...f, o: f.o === "months" ? ABI.months : f.o }));
      const kpi = (f, label, mult = 1, unit = "", d = 1) => {
        const a = avg(numVals(rows, f.k));

      const cards = F.map(f => {
        let body;
        if (f.t === "cat") {
          const counts = f.o.map(o => [o, rows.filter(r => r[f.k] === o).length]);
          body = bars(counts, counts.reduce((a, c) => a + c[1], 0));
        } else {
          const v = numVals(rows, f.k), a = avg(v);
          body = a === null ? '<p class="muted">Noch keine Werte.</p>' :
            `<p><b style="font-size:1.4rem">Ø ${fmt(a, f.dec ?? 1)} ${esc(f.u)}</b><br><span class="muted small">min ${fmt(Math.min(...v), 1)} · max ${fmt(Math.max(...v), 1)} · n=${v.length}</span></p>`;
        }
        return `<div class="stat"><h4>${esc(f.l)}</h4>${body}${f.base ? `<div class="muted small">Ausgangswert PDF: ${esc(f.base)}</div>` : ""}</div>`;
      }).join("");

  /* Unterschrifts-Canvas (Maus + Touch) */
  function initSigPad(root) {
    const c = $("#sigpad", root); if (!c) return;
    const g = c.getContext("2d"); g.lineWidth = 3; g.lineCap = "round"; g.strokeStyle = "#1b1f3a";
    let down = false;
    const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    c.addEventListener("pointerdown", e => { down = true; state.dirty = true; c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); });
    c.addEventListener("pointermove", e => { if (down) { g.lineTo(...pos(e)); g.stroke(); } });
    ["pointerup", "pointercancel"].forEach(ev => c.addEventListener(ev, () => { down = false; }));
  }

  /* ============ 6) Router & Rendering ============ */
  function parseHash() {
    const [id, ...rest] = (location.hash.replace(/^#\/?/, "") || "cover").split("/");
    return { id: VIEWS[id] ? id : "cover", param: rest.join("/") || null };
  }
  function buildNav() {
    const cur = parseHash().id;
    $("#nav").innerHTML = ORDER.map(id => `<a href="#/${id}" class="${id === cur ? "active" : ""}">${VIEWS[id].icon} ${esc(VIEWS[id].title)}</a>`).join("");
  }
  function render(scroll) {
    const { id, param } = parseHash(), v = VIEWS[id];
    $("#view").innerHTML = v.render(param);
    state.dirty = false; state.pending = false;
    v.bind && v.bind($("#view"), param);
    buildNav(); document.title = `${v.title} – Abi Zeitung BGYT24`;
    if (scroll) window.scrollTo(0, 0);
    $("#menuBtn") && document.body.classList.remove("menu-open");
  }
  window.addEventListener("hashchange", () => render(true));

  // Live-Updates: neu zeichnen, außer jemand tippt gerade (dann nach dem Absenden)
  let rt = null;
  Store.onChange(() => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (state.dirty) { state.pending = true; return; } render(false); renderMe(); }, 150);
  });
  document.addEventListener("input", e => { if (e.target.closest("#view form")) state.dirty = true; });

  function renderMe() {
    const sel = $("#meSelect"), list = students();
    const guest = me && !list.some(s => s.id === me.id) ? `<option value="${esc(me.id)}" selected>${esc(me.name)}</option>` : "";
    sel.innerHTML = `<option value="">– wählen –</option>` + list.map(s => `<option value="${esc(s.id)}" ${me && me.id === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("") + guest + `<option value="__guest">Gast / Lehrkraft …</option>`;
  }
  function renderStatus() {
    const m = Store.status(), el = $("#status");
    el.className = "pill " + (m === "live" ? "live" : m === "error" ? "err" : "");
    el.textContent = { local: "💾 lokal", live: "🟢 live", connecting: "⏳ verbinde …", error: "⚠️ offline/lokal" }[m];
    $("#backendInfo").textContent = m === "live" ? "Live-Sync über Supabase aktiv – alle sehen dieselben Daten."
      : "Aktuell nur lokale Speicherung in diesem Browser. Für Live-Sync siehe config.js / README.";
  }
  window.addEventListener("abi:status", renderStatus);

  /* ============ 7) Events ============ */
  const forms = {
    async pin(f) {
      const key = f.dataset.key, files = [...(f.elements.photo?.files || [])], t = (f.elements.t?.value || "").trim();
      if (!t && !files.length) return toast("Bitte Text oder Foto angeben.");
      const base = { title: f.elements.title?.value?.trim() || "", t, by: meName() };
      if (!files.length) await Store.set(`entry/${key}/${uid()}`, { ...base, ts: Date.now() });
      for (const file of files) {
        try { await Store.set(`entry/${key}/${uid()}`, { ...base, img: await resizeImage(file), ts: Date.now() }); }
        catch (e) { toast(e.message); }
      }
      f.reset();
    },
    async survey(f) {
      if (!needMe()) return;
      const v = {}; new FormData(f).forEach((val, k) => { if (val !== "") v[k] = val; });
      await Store.set("survey/" + me.id, v); toast("Danke! Deine Werte sind in der Auswertung.");
    },
    async profile(f) {
      const id = f.dataset.id, prof = Store.get("profile/" + id) || {}, fields = {};
      new FormData(f).forEach((v, k) => { fields[k] = v; });
      await Store.set("profile/" + id, { ...prof, f: fields }); toast("Steckbrief gespeichert.");
    },
    async comment(f) {
      if (!needMe()) return;
      await Store.set(`comment/${f.dataset.id}/${uid()}`, { t: f.t.value.trim(), by: meName(), ts: Date.now() });
    },
    async addStudent(f) { const name = f.elements.name.value.trim(); if (name) await Store.set("student/" + slugify(name) + "-" + uid().slice(-3), { name, unsure: false }); },
    async addTeacher(f) { const name = f.elements.name.value.trim(); if (name) await Store.set("teacher/" + slugify(name) + "-" + uid().slice(-3), { name, unsure: false }); },
    async lkMember(f) { await Store.set(`lkmember/${f.dataset.lk}/${f.elements.id.value}`, 1); },
    async quote(f) { await Store.set("quote/wir", f.q.value.trim()); },
    async schluss(f) { await Store.set("text/schlusswort", f.t.value); toast("Schlusswort gespeichert."); },
    async sig(f) {
      const c = $("#sigpad"); if (!c) return;
      const name = f.elements.name.value.trim() || meName();
      await Store.set("sig/" + uid(), { name, img: c.toDataURL("image/png"), ts: Date.now() }); toast("Unterschrift gespeichert!");

  document.addEventListener("submit", async e => {
    const f = e.target.closest("[data-form]"); if (!f) return;
    e.preventDefault();
    state.dirty = false;
    try { await forms[f.dataset.form](f); } catch (err) { console.error(err); toast("Fehler: " + err.message); }
    state.dirty = false; if (state.pending) render(false);

  const acts = {
    print: () => printCurrent(),
    printall: () => printAll(),
    settings: () => { renderStatus(); $("#settings").showModal(); },
    export() {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([Store.exportJSON()], { type: "application/json" }));

    delpin(b) { if (confirm("Eintrag wirklich löschen?")) Store.del(b.dataset.k); },

  const changes = {
    async vote(el) {
      if (!needMe()) { el.value = ""; return; }
      const k = `vote/${el.dataset.cat}/${el.dataset.i}/${me.id}`;
      el.value ? await Store.set(k, el.value) : await Store.del(k);
    },
    async profphoto(el) {
      if (!el.files[0]) return;
      const id = el.dataset.id, prof = Store.get("profile/" + id) || {};
      await Store.set("profile/" + id, { ...prof, [el.dataset.which]: await resizeImage(el.files[0]) });
    },
    async classphoto(el) { if (el.files[0]) await Store.set("photo/class", await resizeImage(el.files[0], 1400, 0.75)); },
    gotoSel(el) { location.hash = "#/steckbriefe/" + el.value; }
  };
  document.addEventListener("change", async e => {
    const el = e.target;
    if (el.name === "photo" && el.closest(".pin-form")) {
      const n = el.files.length; el.closest(".pin-form").querySelector(".fname").textContent = n ? `${n} Datei(en) gewählt` : "";
    }
    if (el.id === "meSelect") {
      if (el.value === "__guest") { const n = prompt("Dein Name (Gast/Lehrkraft):"); if (n && n.trim()) saveMe({ id: "gast-" + slugify(n), name: n.trim() }); }
      else if (el.value) { const s = studentById(el.value); saveMe({ id: s.id, name: s.name }); }
      renderMe(); render(false); return;
    }
    if (el.id === "importFile" && el.files[0]) {
      try { await Store.importJSON(await el.files[0].text()); toast("Import abgeschlossen."); } catch (err) { toast("Import fehlgeschlagen: " + err.message); }
      el.value = ""; return;
    }
    const k = el.dataset.change;
    if (k && changes[k]) { try { await changes[k](el); } catch (err) { toast("Fehler: " + err.message); } }
  });

  /* ============ 8) Druck / PDF ============ */
  // "Als PDF speichern" = Druckdialog des Browsers → Ziel "Als PDF speichern". Das @media-print-Layout liegt in styles.css.
  function printCurrent() {

  }
  function printAll() {
    state.printing = true;
    $("#printAll").innerHTML = ORDER.map(id => {
      const v = VIEWS[id], params = v.params ? v.params() : [null];
      return params.map(p => `<section class="print-section">${v.render(p)}</section>`).join("");
    }).join("");
    document.body.classList.add("print-all"); setTimeout(() => window.print(), 300);
  }
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("print-one", "print-all");
    $("#printAll").innerHTML = ""; state.printing = false; render(false);
  });

  /* ============ 9) Start ============ */
  renderMe(); renderStatus(); render(true);
  if (!me) setTimeout(() => toast("Willkommen! Wähle oben „Ich bin“, damit du abstimmen & deinen Steckbrief bearbeiten kannst."), 600);
  Store.init();
})();

</script>
<script>
  /* Hell/Dunkel: folgt dem Gerät, der Schalter 🌓 überschreibt das und wird gemerkt */
  (function () {
    var r = document.documentElement, t = null;
    try { t = localStorage.getItem("abi24:theme"); } catch (e) {}
    if (t) r.setAttribute("data-theme", t);
    document.getElementById("themeBtn").addEventListener("click", function () {
      var cur = r.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var n = dark ? "light" : "dark"; r.setAttribute("data-theme", n);
      try { localStorage.setItem("abi24:theme", n); } catch (e) {}
    });
  })();
</script>
